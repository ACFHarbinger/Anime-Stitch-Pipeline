[project]
name = "dev-repo-template-dev-assistant"
version = "0.1.0"
description = "Polyglot developer-assistant tool: dependency-graph visualization, circular-import detection, layer-violation checks."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
