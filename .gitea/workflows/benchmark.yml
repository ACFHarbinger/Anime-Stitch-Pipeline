name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/benchmark/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev && uv run pytest benchmark --benchmark-only
        working-directory: backend
