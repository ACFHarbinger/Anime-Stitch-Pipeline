[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-stitch-pipeline"
version = "0.1.0"
description = "Anime Stitch Pipeline (ASP) — panorama stitching engine."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "python-dotenv>=1.0.0",
    # Core numerics / image processing
    "numpy>=2.3.4",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=12.3.0",
    "psutil>=7.1.3",
    "scipy>=1.16.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    # ML / matching backbones
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=5.14.1",
    "kornia>=0.8.2",
    "huggingface_hub",
    # GUI + video
    "pyside6>=6.10.0",
    "av>=17.0.1",
]

[project.optional-dependencies]
# Matcher plugins (core/pipeline/_matcher_selection.py, alignment/matching/,
# ingestion/masking.py) — every import site already wraps these in
# try/except ImportError (see core/pipeline/_probes.py's _ROMA_OK/
# _SEA_RAFT_OK flags, core/data_serialization.py's coco_mask, masking.py's
# "§3.14 lazy" SAM-2 imports) and the matching cascade (EfficientLoFTR ->
# kornia LoFTR -> ALIKED+LightGlue -> template/phase-correlation) already
# degrades gracefully without them. They were listed as hard dependencies
# despite that, which is a real problem: mamba_ssm compiles a CUDA
# extension from source (needs `nvcc` at build time) and unconditionally
# breaks `uv sync` on any machine without a CUDA toolchain -- including,
# almost certainly, GitHub's standard `ubuntu-latest` CI runners. Moved
# here so the base install (and CI) works without a GPU; install this
# extra explicitly on a CUDA-capable dev machine to exercise
# mamba_ssm/RoMa/SEA-RAFT/SAM-2-specific matcher paths. Loosely pinned
# since upstream doesn't publish stable release cadences for these
# research packages.
matchers = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "ptlflow",
    "romatch",
    "mamba_ssm",
    "pycocotools",
]
# The FiftyOne corpus-triage surface of the ASP evaluation tool
# (backend/benchmark/evaluation/plugin/). Dev-only and deliberately not a
# default dependency — pulls ~30 packages plus an embedded MongoDB.
benchmark-eval = [
    "fiftyone>=1.19.0,<2",
]
benchmark = [
    "matplotlib>=3.10.8",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    # python/validation/ dev-tooling (module dependency graphs, LoC reports)
    "jinja2",
    "rich",
    "pyvis>=0.3.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
