# GitLab CI/CD Pipeline
# Native-syntax translation of the GitHub Actions workflows under .github/workflows/:
# ci.yml, benchmark.yml, security.yml, docs.yml.

stages:
  - test
  - security
  - docs
  - benchmark

# ==========================================
# STAGE: TEST (ci.yml)
# ==========================================
lint-test-backend:
  stage: test
  image: python:3.12
  script:
    - pip install uv
    - cd backend
    - uv sync --group dev
    - uv run ruff check .
    - uv run mypy src
    - uv run pytest test -v --cov=src --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

lint-test-gui:
  stage: test
  image: python:3.12
  script:
    - pip install uv
    - cd gui
    - uv sync --group dev
    - uv run ruff check .
    - uv run mypy src

build-test-base:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y cmake g++ make libopencv-dev
  script:
    - cmake -S base -B base/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    - cmake --build base/build --parallel
    - ctest --test-dir base/build --output-on-failure

# ==========================================
# STAGE: SECURITY (security.yml)
# ==========================================
security-pip-audit-backend:
  stage: security
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install uv
    - cd backend
    - uv sync --group dev
    - uv run pip-audit

security-pip-audit-gui:
  stage: security
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install uv
    - cd gui
    - uv sync --group dev
    - uv run pip-audit

# ==========================================
# STAGE: DOCS (docs.yml)
# ==========================================
# This special job name "pages" is required by GitLab to deploy to GitLab Pages.
pages:
  stage: docs
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "docs/**/*"
        - "backend/validation/docs/**/*"
        - "mkdocs.yml"
  script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm
    - pip install uv
    - uv pip install --system mkdocs-material mkdocstrings[python] mkdocs-jupyter
    - mkdocs build --config-file docs/mkdocs.yml --strict --site-dir site
    - cd docs/website && npm ci && SITE_BASE=/app/ npm run build && cd ../..
    - mkdir -p site/app && cp -r docs/website/dist/. site/app/
    # GitLab Pages requires the output directory to be named "public"
    - mv site public
  artifacts:
    paths:
      - public

# ==========================================
# STAGE: BENCHMARK (benchmark.yml)
# ==========================================
benchmark:
  stage: benchmark
  image: python:3.12
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "backend/benchmark/**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - pip install uv
    - cd backend
    - uv sync --group dev
    - uv run pytest benchmark --benchmark-only
