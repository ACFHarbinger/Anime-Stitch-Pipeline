[project]
name = "dev-repo-template"
version = "0.1.0"
description = "Root workspace manifest for Dev-Repo-Template. The actual Python module lives in python/ (see python/pyproject.toml)."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
dependencies = []

[tool.uv.workspace]
members = ["python"]

[tool.uv]
# Root has no code of its own — just a workspace pointer to python/. Don't
# try to build/install it as a package (avoids setuptools' flat-layout
# autodiscovery tripping over every other top-level language/infra dir).
package = false
