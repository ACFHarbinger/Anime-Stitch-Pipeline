[project]
name = "dev-repo-template"
version = "0.1.0"
description = "Root workspace manifest for Dev-Repo-Template. The actual Python module lives in python/ (see python/pyproject.toml)."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
dependencies = []

[tool.uv.workspace]
members = ["python"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
