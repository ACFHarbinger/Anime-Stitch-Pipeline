name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "backend/validation/docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system mkdocs-material mkdocstrings[python] mkdocs-jupyter
      - run: mkdocs build --config-file docs/mkdocs.yml --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci
        working-directory: docs/website
      - run: npm run build
        working-directory: docs/website
        env:
          SITE_BASE: /${{ github.event.repository.name }}/app/
      - run: mkdir -p build/gen/site/app && cp -r docs/website/dist/. build/gen/site/app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.REPO_PROJECT_TOKEN }}
          publish_dir: ./build/gen/site
