name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  pull_request:
    branches: [main]

jobs:
  pip-audit-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
        working-directory: backend
      - run: uv run pip-audit
        working-directory: backend

  pip-audit-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
        working-directory: gui
      - run: uv run pip-audit
        working-directory: gui
