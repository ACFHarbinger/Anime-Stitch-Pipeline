apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-repo-template.name" . }}
  labels:
    {{- include "dev-repo-template.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dev-repo-template.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-repo-template.labels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "dev-repo-template.name" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
