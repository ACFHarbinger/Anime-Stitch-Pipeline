site_name: Anime-Stitch-Pipeline Documentation
site_description: >-
  Documentation portal for the Anime Stitch Pipeline (ASP) panorama stitching engine.
site_author: ACFHarbinger
repo_url: https://github.com/ACFHarbinger/Anime-Stitch-Pipeline
repo_name: ACFHarbinger/Anime-Stitch-Pipeline
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ../build/gen/site
exclude_docs: |
  sphinx/conf.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../backend/src, ../gui/src]
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Development: DEVELOPMENT.md
  - Testing: TESTING.md
  - Dependencies: DEPENDENCIES.md
  - Dependency Policy: DEPENDENCY_POLICY.md
  - Documentation Standards: DOCUMENTATION_STANDARDS.md
  - Benchmarks: BENCHMARKS.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Glossary: GLOSSARY.md
  - Tutorials:
      - Getting Started with HybridStitch: tutorials/getting-started-hybridstitch.md
      - ASP Pipeline Overview: tutorials/pipeline-overview.md
  - Architecture Decisions: adr/
  - Roadmap: moon/ROADMAP.md
  - Changelog: moon/CHANGELOG.md
  - Research:
      - ASP Comprehensive Research: research/ASP_Comprehensive_Research_Report.md
      - Image Stitching Research: research/Image_Stitching_Research.md
  - Reports:
      - ASP Critical Evaluation: reports/ASP_Critical_Evaluation_2026-07-08.md
      - Image Stitching Report: reports/image_stitching_report.md
  - Image-Toolkit (parent project): https://github.com/ACFHarbinger/Image-Toolkit
