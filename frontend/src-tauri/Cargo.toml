[package]
name = "anime-stitch-pipeline-frontend"
version = "0.1.0"
description = "ASP cross-platform desktop UI (Tauri) — scaffold, not yet implemented."
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
